trigger:
  - none

parameters:
  - name: targetEnvironment
    type: string
    default: development
    values:
      - development
      - test
      - acceptance
      - production

  - name: azureKV
    type: string
    default: batr-dlz-vlt
    values:
      - batr-dlz-vlt
      - batr-tlz-vlt
      - batr-alz-vlt
      - batr-plz-vlt

  - name: rotateSecrets
    type: string
    default: 'no'
    values:
      - 'yes'
      - 'no'

  - name: rotateKey
    type: string
    default: 'no'
    values:
      - 'yes'
      - 'no'

  - name: updateKey
    type: string
    default: 'no'
    values:
      - 'yes'
      - 'no'

  - name: enforce_activation_date
    type: string
    default: 'no'
    values:
      - 'yes'
      - 'no'

  - name: enforce_expiry_date
    type: string
    default: 'no'
    values:
      - 'yes'
      - 'no'

  - name: keyName
    type: string

resources:
  repositories:
    - repository: pipetemplates
      type: git
      name: GRD0001045/pita-pipeline-templates
      ref: refs/heads/master

variables:
  - template: ../../parameter/${{ parameters.targetEnvironment }}.variables.yml

stages:
  - ${{ if in(parameters.targetEnvironment, 'acceptance', 'production') }}:
      stage: ${{ parameters.targetEnvironment }}_RotateSecret_CreateChange
      displayName: ${{ parameters.targetEnvironment }}-Create-ServiceNow-Change
      jobs:
        - template: /generic/servicenow/create-change.yml@pipetemplates
          parameters:
            app_config_id: $(SnowCI)
            app_version_number: $(AppVersionNumber)
            approval_environment: BATR3-${{ parameters.targetEnvironment }}-approval

  - ${{ if in(parameters.targetEnvironment, 'acceptance', 'production') }}:
      stage: ${{ parameters.targetEnvironment }}_RotateSecret_TruncateExpiry
      dependsOn:
        - ${{ parameters.targetEnvironment }}_RotateSecret_CreateChange
      displayName: ${{ parameters.targetEnvironment }}-Secret-Expiry-Enforcement
      jobs:
        - job: Truncate_KV_Secret_Expiry
          displayName: Truncate Key Vault secret expiry dates
          pool:
            name: Private Pool Deployment

          steps:
            - task: AzureCLI@2
              displayName: Truncate secret expiry dates
              inputs:
                azureSubscription: ${{ variables.serviceConnectionName }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  vaultName="${{ parameters.azureKV }}"
                  now=$(date +%Y-%m-%d)

                  maxExpiry=$(date -u -d "+365 days" '+%Y-%m-%dT%H:%M:%SZ')
                  maxExpiryEpoch=$(date -u -d "$maxExpiry" +%s)

                  echo "Key Vault: $vaultName"
                  echo "Maximum allowed expiry: $maxExpiry"

                  secretNames=$(az keyvault secret list \
                    --vault-name "$vaultName" \
                    --query "[].name" \
                    -o tsv | tr -d '\r')

                  for secretName in $secretNames; do

                    echo "Checking secret: $secretName"

                    expires=$(az keyvault secret show \
                      --vault-name "$vaultName" \
                      --name "$secretName" \
                      --query "attributes.expires" \
                      -o tsv)

                    if [ -z "$expires" ] || [ "$expires" = "null" ]; then
                      echo "Secret '$secretName' has no expiry. Skipping."
                      continue
                    fi

                    expiryEpoch=$(date -u -d "$expires" +%s)

                    if [ "$expiryEpoch" -le "$maxExpiryEpoch" ]; then
                      echo "Secret '$secretName' expiry is within 365 days. Skipping."
                      continue
                    fi

                    echo "Secret '$secretName' exceeds 365 days."
                    echo "Current expiry: $expires"
                    echo "New expiry:     $maxExpiry"

                    secretValue=$(az keyvault secret show \
                      --vault-name "$vaultName" \
                      --name "$secretName" \
                      --query "value" \
                      -o tsv)

                    az keyvault secret set \
                      --vault-name "$vaultName" \
                      --name "$secretName" \
                      --value "$secretValue" \
                      --expires "$maxExpiry" \
                      --not-before "$now" \

                    echo "Secret '$secretName' updated successfully."

                  done

            - task: AzureCLI@2
              displayName: Disable old Key Vault secret versions
              inputs:
                azureSubscription: ${{ variables.serviceConnectionName }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail

                  vaultName="${{ parameters.azureKV }}"

                  secretNames=$(az keyvault secret list \
                    --vault-name "$vaultName" \
                    --query "[].name" \
                    -o tsv | tr -d '\r')

                  for secretName in $secretNames; do

                    echo "Checking versions for secret: $secretName"

                    currentVersionId=$(az keyvault secret show \
                      --vault-name "$vaultName" \
                      --name "$secretName" \
                      --query "id" \
                      -o tsv)

                    versionIds=$(az keyvault secret list-versions \
                      --vault-name "$vaultName" \
                      --name "$secretName" \
                      --query "[].id" \
                      -o tsv | tr -d '\r')

                    for versionId in $versionIds; do

                      if [ "$versionId" != "$currentVersionId" ]; then

                        echo "Disabling old version: $versionId"

                        az keyvault secret set-attributes \
                          --id "$versionId" \
                          --enabled false \
                          --output none

                      fi

                    done

                  done

                  echo "Old secret versions disabled successfully."

  - ${{ if in(parameters.targetEnvironment, 'acceptance', 'production') }}:
      stage: ${{ parameters.targetEnvironment }}_RotateSecret_Verification
      dependsOn: ${{ parameters.targetEnvironment }}_RotateSecret_TruncateExpiry
      condition: or(failed(), succeeded('${{ parameters.targetEnvironment }}_RotateSecret_TruncateExpiry'))
      displayName: ${{ parameters.targetEnvironment }}-Verification
      jobs:
        - deployment: DeploymentVerification_Approval
          displayName: Verification_Approval
          environment: BATR3-${{ parameters.targetEnvironment }}-approval
          template: /generic/servicenow/close-change-stage.yml@pipetemplates
          parameters:
            close_status: Success
            depends_on_job: DeploymentVerification_Approval

###################################### 

#!/usr/bin/env bash
set -euo pipefail

vaultName="test-vlt"
secretName="my-secret-name"

# 1. Capture the current version's id and value BEFORE creating a new version
oldVersionId=$(az keyvault secret show \
    --vault-name "$vaultName" \
    --name "$secretName" \
    --query "id" -o tsv)
# oldVersionId looks like: https://<vault>.vault.azure.net/secrets/<name>/<version>
oldVersion=$(basename "$oldVersionId")

secretValue=$(az keyvault secret show \
    --vault-name "$vaultName" \
    --name "$secretName" \
    --query "value" -o tsv)

echo "Current version: $oldVersion"

# 2. Compute new expiry = today + 365 days (UTC, ISO 8601)
newExpiry=$(date -u -d "+365 days" '+%Y-%m-%dT%H:%M:%SZ')
echo "New expiry: $newExpiry"

# 3. Create a new version with the same value and the new expiry
az keyvault secret set \
    --vault-name "$vaultName" \
    --name "$secretName" \
    --value "$secretValue" \
    --expires "$newExpiry"

newVersionId=$(az keyvault secret show \
    --vault-name "$vaultName" \
    --name "$secretName" \
    --query "id" -o tsv)
newVersion=$(basename "$newVersionId")
echo "New version created: $newVersion"

# 4. Disable the OLD version explicitly (new version stays enabled)
az keyvault secret set-attributes \
    --vault-name "$vaultName" \
    --name "$secretName" \
    --version "$oldVersion" \
    --enabled false

echo "✓ Old version $oldVersion disabled. New version $newVersion is active with expiry $newExpiry."