
trigger: none

# Run daily at 8 AM UTC
schedules:
  - cron: "0 8 * * *"
    displayName: Daily Entra secret expiry check
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sc-azure-platform'
  expiryDays: 30

steps:
  - task: AzureCLI@2
    displayName: 'Check Entra App Registration Secret Expiry'
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -euo pipefail

        echo "=========================================="
        echo " Entra ID Client Secret Expiry Report"
        echo "=========================================="

        DAYS=$(expiryDays)

        NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        CUTOFF=$(date -u -d "+${DAYS} days" +"%Y-%m-%dT%H:%M:%SZ")

        echo "Current UTC time : $NOW"
        echo "Expiry threshold : $CUTOFF"
        echo ""

        NEXT_URL='https://graph.microsoft.com/v1.0/applications?$select=id,appId,displayName,passwordCredentials&$top=999'

        TEMP_FILE=$(mktemp)
        trap 'rm -f "$TEMP_FILE"' EXIT

        APP_COUNT=0

        echo "Retrieving App Registrations from Microsoft Graph..."

        while [[ -n "$NEXT_URL" ]]; do

          RESPONSE=$(az rest \
            --method GET \
            --url "$NEXT_URL" \
            --resource https://graph.microsoft.com/ \
            --output json)

          # Append applications from current page
          echo "$RESPONSE" | jq -c '.value[]' >> "$TEMP_FILE"

          NEXT_URL=$(echo "$RESPONSE" | jq -r '."@odata.nextLink" // empty')

        done

        APP_COUNT=$(wc -l < "$TEMP_FILE")

        echo "Total applications retrieved: $APP_COUNT"
        echo ""

        export TEMP_FILE DAYS NOW CUTOFF

        python3 <<'PY'
        import json
        import os
        from datetime import datetime, timezone, timedelta

        now = datetime.fromisoformat(
            os.environ["NOW"].replace("Z", "+00:00")
        )

        cutoff = datetime.fromisoformat(
            os.environ["CUTOFF"].replace("Z", "+00:00")
        )

        days = int(os.environ["DAYS"])

        expiring = []

        with open(os.environ["TEMP_FILE"], "r") as f:
            for line in f:
                app = json.loads(line)

                for secret in app.get("passwordCredentials", []):
                    expiry = datetime.fromisoformat(
                        secret["endDateTime"].replace("Z", "+00:00")
                    )

                    if now <= expiry <= cutoff:
                        remaining = (expiry - now).total_seconds() / 86400

                        expiring.append({
                            "appName": app.get("displayName") or "N/A",
                            "appId": app.get("appId") or "N/A",
                            "keyId": secret.get("keyId") or "N/A",
                            "expiry": expiry.strftime("%Y-%m-%d %H:%M UTC"),
                            "daysRemaining": round(remaining, 1)
                        })

        expiring.sort(key=lambda x: x["daysRemaining"])

        print("=" * 115)
        print(f"CLIENT SECRETS EXPIRING WITHIN NEXT {days} DAYS")
        print("=" * 115)

        if not expiring:
            print("No client secrets are expiring within the specified period.")
        else:
            print(
                f"{'APPLICATION':35} "
                f"{'APP ID':36} "
                f"{'EXPIRY DATE':23} "
                f"{'DAYS LEFT':10}"
            )

            print("-" * 115)

            for item in expiring:
                print(
                    f"{item['appName'][:34]:35} "
                    f"{item['appId']:36} "
                    f"{item['expiry']:23} "
                    f"{item['daysRemaining']:10.1f}"
                )

                print(f"  Secret Key ID: {item['keyId']}")

            print("-" * 115)
            print(f"Total expiring secrets: {len(expiring)}")

        print("=" * 115)
        PY

        echo ""
        echo "Secret expiry check completed successfully."
        
