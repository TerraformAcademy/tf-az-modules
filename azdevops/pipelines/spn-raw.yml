# This is an example YAML pipeline that is provided by the FTT team since October 2022 to be used as a started pipeline for transition customers.
# This YAML pipeline file can be used in FSCP 3.0 Landing Zone environments to deploy Azure Resources.
# PIPE team have created reusable Templates and Mandatory Building blocks which can be used in the CI/CD Pipelines to save developers time and to be in control,
# Please check PIPE wiki page for more information about all the templates and building blocks usage- https://dev.azure.com/cbsp-abnamro/GRD0001045/ wiki/wikis/PITA%20templates/11780/pipeline-templates

name: SPN Configuration

# Parameters: This will help to pass the values to your pipeline templates during run time or by default. This will help you running a pipeline with certain values by changing it as required.

parameters:
- name: targetEnvironment # The LZ environment to deploy to.
  type: string
  default: development
  values:
   - development
   - test
   - acceptance
   - production

- name: Action # The LZ environment to deploy to.
  type: string
  default: Create/Update Provider SPN
  values:
    - Create/Update Provider SPN
    - Create/Update Consumer SPN
    - Create/Update Consumer SPN For BATR-AZ-IAG
    - Create/Update Consumer SPN For DIAL-AZ-IAG
    - Add/Update Consumer SPN BATR-AZ-IAG To Security Group
    - Add/Update Consumer SPN DIAL-AZ-IAG To Security Group
    - Create/Store Provider Secret
    - Create/Store Consumer Secret
    - Create/Store Consumer Secret for BATR-AZ-IAG
    - Create/Store Consumer Secret for DIAL-AZ-IAG
    - Create App Role
    - Set User Assignment for Internal Use
    - Set User Assignment for CATR

# Variables: These are general variables which also can be used to pass values to your tasks in stages and jobs.
# Variables declared below are considered as global variables which are used in all the stages and jobs in this entire pipeline.

variables:
# Variable templates can be used in combination with group variables having pipeline specific variables.
# Where variable groups contain variables which remain the same for all pipelines consuming that particular variable group.
# Variable templates can be defined on a global, stage and job level so specific variable templates can be used for specific DTAP deploymments or within loops.

- template: ../../parameter/global.variables.yml

repositories:
  - repository: pipetemplates
    type: git
    name: 'GRD0001045/pita-pipeline-templates'
    ref: 'refs/heads/master'

# A pipeline with no Cl trigger 
trigger: none

# Don't run against PRs
pr: none

# Get the agent pool to use from global variables
pool:
 vmimage: windows-latest

# Stages are used to define your pipeline stages like Build, Create Infrastructure, Deploy, Verification

stages:

#STAGE: Infrastructure Validation

#Infra validation is recommended to validate code syntax and do a preview deployment without doing actual changes.

#No changes will be made when there's an error in the validation stage.

