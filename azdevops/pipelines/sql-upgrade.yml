name: Sql Db Modifications

parameters:
  - name: targetEnvironment
    type: string
    default: acceptance
    values:
      - test
      - acceptance
      - production

  - name: action
    type: string
    default: serverconfig
    values:
      - serverconfig
      - dbupgrade
      - keySet
      - keyRevalidate

  - name: sqldbvcore
    displayName: Number of vcores (Only Applicable if action is 'dbupgrade')
    type: string

variables:
  - template: ../../parameter/global.variables.yml

resources:
  repositories:
    - repository: pipetemplates
      type: git
      name: 'GRD0001045/pita-pipeline-templates'
      ref: 'refs/heads/master'

trigger: none
pr: none

pool:
  name: Private Pool Deployment Docker

stages:
  - stage: ${{ parameters.targetEnvironment }}_SqlDbUpgrade
    condition: succeeded()
    variables:
      - template: ../../parameter/${{ parameters.targetEnvironment }}.variables.yml
    jobs:
      - ${{ if in(parameters.targetEnvironment, 'acceptance', 'production') }}:
          - template: /generic/servicenow/create-change.yml@pipetemplates
            parameters:
              app_config_id: $(SnowCI)
              app_version_number: $(AppVersionNumber)
              approval_environment: 'BATR3-${{ parameters.targetEnvironment }}-approval'
              description: 'SqlDbUpgrade in ${{ parameters.targetEnvironment }}'

      - ${{ if eq(parameters.action, 'dbupgrade') }}:
          - job: SqlDbUpgradeBicep
            displayName: Sql Db Upgrade Bicep
            steps:
              - checkout: self
                path: ./s/self

              - task: AzureCLI@2
                inputs:
                  azureSubscription: ${{ variables.ServiceConnectionName }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    # az sql db update -g ${{ variables.resourceGroupName }} -s ${{ variables.SqlServerName }} -n ${{ variables.SqlDatabaseName }} --update-args

      - ${{ if eq(parameters.action, 'keyRevalidate') }}:
          - job: keyRevalidate
            displayName: key Revalidate
            steps:
              - checkout: self
                path: ./s/self

              - task: AzureCLI@2
                inputs:
                  azureSubscription: ${{ variables.ServiceConnectionName }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    az sql server tde-key revalidate -g ${{ variables.resourceGroupName }} -s ${{ variables.SqlServerName }}

      - ${{ if eq(parameters.action, 'serverconfig') }}:
          - job: SqlServerUpgradeBicep
            displayName: Sql Server Upgrade Bicep
            steps:
              - checkout: self
                path: ./s/self

              - task: AzureResourceManagerTemplateDeployment@3
                displayName: Deploy Bicep infra template
                enabled: true
                name: DeployInfraBicep
                inputs:
                  action: 'Create Or Update Resource Group'
                  azureResourceManagerConnection: ${{ variables.ServiceConnectionName }}
                  csmFile: '../../template/Sql/main.server.bicep'
                  csmParametersFile: '../../template/Sql/bicep.sqlserver.${{ parameters.targetEnvironment }}.json'
                  deploymentMode: Incremental
                  deploymentOutputs: resourceGroupDeploymentOutputs
                  deploymentScope: Resource Group
                  resourceGroupName: ${{ variables.ResourceGroupName }}
                  location: ${{ variables.location }}
                  subscriptionId: ${{ variables.SubscriptionId }}
                  templateLocation: Linked artifact

  - ${{ if in(parameters.targetEnvironment, 'acceptance', 'production') }}:
      - stage: ${{ parameters.targetEnvironment }}_DeploymentVerification
        dependsOn: ${{ parameters.targetEnvironment }}_SqlDbUpgrade
        condition: or(failed(), succeeded('${{ parameters.targetEnvironment }}_SqlDbUpgrade'))
        displayName: ${{ parameters.targetEnvironment }}-Verification
        jobs:
          - deployment: DeploymentVerification_Approval
            displayName: Verification_Approval
            environment: 'BATR3-${{ parameters.targetEnvironment }}-approval'

          - template: /generic/servicenow/close-change-stage.yml@pipetemplates
            parameters:
              close_status: 'Success'
              depends_on_job: 'DeploymentVerification_Approval'

  - stage: ${{ parameters.targetEnvironment }}_close_failed_servicenow_change
    dependsOn:
      - ${{ parameters.targetEnvironment }}_DeploymentVerification
    condition: or(and(not(succeeded('${{ parameters.targetEnvironment }}_DeploymentVerification')), eq(variables['System.StageAttempt'], 1)), canceled())
    displayName: Close-failed-ServiceNow-change
    jobs:
      - template: /generic/servicenow/close-change-stage.yml@pipetemplates
        parameters:
          close_status: 'Failure'
