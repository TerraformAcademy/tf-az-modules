
variables:
  applicationObjectId: 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx'
  keyVaultName: 'kv-identity-prod'
  secretName: 'my-spn-secret'
  secretExpiryDateTime: '2027-10-26T00:00:00Z'
  azureServiceConnection: 'sc-identity-automation'

- task: AzureCLI@2
  displayName: 'Rotate Entra SPN Secret'
  inputs:
    azureSubscription: 'sc-identity-automation'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      set +x

      appObjectId="$(applicationObjectId)"
      keyVaultName="$(keyVaultName)"
      secretName="$(secretName)"
      expiryDate="$(secretExpiryDateTime)"

      body=$(jq -n \
        --arg displayName "Azure DevOps rotation" \
        --arg endDateTime "$expiryDate" \
        '{
          passwordCredential: {
            displayName: $displayName,
            endDateTime: $endDateTime
          }
        }')

      response=$(az rest \
        --method POST \
        --url "https://graph.microsoft.com/v1.0/applications/${appObjectId}/addPassword" \
        --headers "Content-Type=application/json" \
        --body "$body")

      secretValue=$(jq -er '.secretText' <<< "$response")

      az keyvault secret set \
        --vault-name "$keyVaultName" \
        --name "$secretName" \
        --value "$secretValue" \
        --output none

      unset secretValue response body

      echo "SPN secret rotated and stored in Key Vault."
  env:
    applicationObjectId: $(applicationObjectId)
    keyVaultName: $(keyVaultName)
    secretName: $(secretName)
    secretExpiryDateTime: $(secretExpiryDateTime)



- task: AzureCLI@2
  displayName: 'Remove Expired SPN Credentials'
  inputs:
    azureSubscription: 'sc-identity-automation'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail
      set +x

      appObjectId="${APP_OBJECT_ID}"

      graphUrl="https://graph.microsoft.com/v1.0/applications/${appObjectId}"

      # Retrieve existing password credentials.
      credentials=$(az rest \
        --method GET \
        --url "${graphUrl}?\$select=id,passwordCredentials")

      nowEpoch=$(date -u +%s)
      removedCount=0

      # Identify credentials that have expired.
      while IFS='|' read -r keyId expiry; do
        [ -n "$keyId" ] || continue
        [ -n "$expiry" ] || continue

        expiryEpoch=$(date -u -d "$expiry" +%s)

        if [ "$expiryEpoch" -lt "$nowEpoch" ]; then
          echo "Removing expired credential: ${keyId}, expiry: ${expiry}"

          body=$(jq -n --arg keyId "$keyId" '{keyId: $keyId}')

          az rest \
            --method POST \
            --url "${graphUrl}/removePassword" \
            --headers "Content-Type=application/json" \
            --body "$body" \
            --output none

          removedCount=$((removedCount + 1))
        fi
      done < <(
        jq -r '
          .passwordCredentials[]?
          | select(.endDateTime != null)
          | [.keyId, .endDateTime]
          | join("|")
        ' <<< "$credentials"
      )

      echo "Expired credentials removed: ${removedCount}"
  env:
    APP_OBJECT_ID: $(applicationObjectId)
